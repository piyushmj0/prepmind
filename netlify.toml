[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/api/*"
  to = "http://15.135.137.119:3000/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "http://15.135.137.119:3000/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ai/*"
  to = "http://15.135.137.119:3000/ai/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
